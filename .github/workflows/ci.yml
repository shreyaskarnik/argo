name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep apt-get / playwright --with-deps from stalling on an interactive
# prompt (the root cause of past 6h CI hangs on the browser-install step).
env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  unit:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # A stalled apt/playwright install should fail fast, not burn the full
    # 6h default job budget. The unit suite itself runs in seconds.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. Testing only the top hid a test
        # that used a Node 22+ API and silently collected zero assertions
        # everywhere below it.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # ffmpeg is needed for boundary-frame extraction and shader pre-render.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  cross-browser:
    name: ci-smoke (${{ matrix.browser }})
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ARGO_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      # chromium is also installed even when recording on webkit/firefox —
      # shader-render uses headless chromium for WebGL regardless of the
      # recording browser.
      - run: npx playwright install --with-deps chromium "$ARGO_BROWSER"
      - run: npm run build

      - name: Run pipeline
        run: npx tsx bin/argo.js pipeline ci-smoke --config demos/ci-smoke.config.mjs --browser "$ARGO_BROWSER"

      - name: Verify output
        run: |
          pip install --quiet pillow
          python3 scripts/verify-ci-smoke.py videos/ci-smoke.mp4

      - name: Upload mp4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-${{ matrix.browser }}
          path: videos/ci-smoke.mp4
          if-no-files-found: warn
